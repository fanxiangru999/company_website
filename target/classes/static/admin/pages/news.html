<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新闻管理</title>
  <link rel="stylesheet" href="/admin/css/admin.css">
</head>
<body>
<div class="card">
  <div class="toolbar">
    <div class="left"><span class="page-title">新闻管理</span></div>
    <div class="right">
      <input class="input" id="kw" placeholder="输入标题搜索" style="width:200px">
      <button class="btn" id="searchBtn">搜索</button>
      <button class="btn btn--primary" id="addBtn">+ 新增新闻</button>
    </div>
  </div>
  <div class="table-wrap">
    <table class="tb">
      <thead><tr><th width="110">封面</th><th>标题</th><th width="100">作者</th><th width="80">浏览</th><th width="120">发布日期</th><th width="90">状态</th><th width="150">操作</th></tr></thead>
      <tbody id="tbody"><tr><td colspan="7" class="empty">加载中…</td></tr></tbody>
    </table>
  </div>
  <div class="pager" id="pager"></div>
</div>

<script src="/admin/js/admin-common.js"></script>
<script>
  Admin.guard();
  var API = '/api/admin/news', listCache = [], editingId = null, page = 1, size = 8, kw = '';

  function load(p) {
    page = p || 1;
    var url = API + '/page?pageNum=' + page + '&pageSize=' + size + (kw ? '&title=' + encodeURIComponent(kw) : '');
    Admin.get(url).then(function (d) { listCache = d.records || []; render(); renderPager(d.total || 0); })
      .catch(function (e) { Admin.toast(e.message, 'error'); });
  }
  function render() {
    var tb = document.getElementById('tbody');
    if (!listCache.length) { tb.innerHTML = '<tr><td colspan="7" class="empty">暂无数据</td></tr>'; return; }
    tb.innerHTML = listCache.map(function (n) {
      return '<tr><td>' + (n.coverImage ? '<img class="thumb" src="' + Admin.esc(n.coverImage) + '">' : '-') + '</td>' +
        '<td>' + Admin.esc(n.title) + '</td><td style="color:#909399">' + Admin.esc(n.author || '') + '</td>' +
        '<td style="color:#909399">' + (n.views || 0) + '</td>' +
        '<td style="color:#909399">' + Admin.fmtDate(n.publishDate) + '</td>' +
        '<td>' + (n.status == 0 ? '<span class="tag tag--off">草稿</span>' : '<span class="tag tag--on">已发布</span>') + '</td>' +
        '<td><button class="btn--text primary" data-act="edit" data-id="' + n.id + '">编辑</button>' +
        '<button class="btn--text danger" data-act="del" data-id="' + n.id + '">删除</button></td></tr>';
    }).join('');
  }
  function renderPager(total) {
    var pages = Math.ceil(total / size) || 1, box = document.getElementById('pager'), h = '';
    h += '<span class="info">共 ' + total + ' 条</span>';
    h += '<button ' + (page <= 1 ? 'disabled' : '') + ' data-p="' + (page - 1) + '">上一页</button>';
    for (var i = 1; i <= pages; i++) h += '<button class="' + (i === page ? 'active' : '') + '" data-p="' + i + '">' + i + '</button>';
    h += '<button ' + (page >= pages ? 'disabled' : '') + ' data-p="' + (page + 1) + '">下一页</button>';
    box.innerHTML = h;
    box.querySelectorAll('button[data-p]').forEach(function (b) {
      b.addEventListener('click', function () { var p = +this.dataset.p; if (p >= 1 && p <= pages) load(p); });
    });
  }

  function formBody(d) {
    d = d || {};
    return '' +
      '<div class="form-item"><label><span class="req">*</span>标题</label><input class="input" id="f_title" value="' + Admin.esc(d.title || '') + '"></div>' +
      '<div class="form-item"><label>摘要</label><textarea class="textarea" id="f_summary">' + Admin.esc(d.summary || '') + '</textarea></div>' +
      '<div class="form-item"><label>封面图</label><div class="uploader">' +
        '<div class="preview"><img ' + (d.coverImage ? 'src="' + Admin.esc(d.coverImage) + '"' : 'style="display:none"') + '></div>' +
        '<div><input type="file" accept="image/*" data-upload><div class="tip">选择图片自动上传，建议 640×400</div></div></div>' +
        '<input type="hidden" data-url id="f_cover" value="' + Admin.esc(d.coverImage || '') + '"></div>' +
      '<div class="form-row"><div class="form-item"><label>作者</label><input class="input" id="f_author" value="' + Admin.esc(d.author || '管理员') + '"></div>' +
        '<div class="form-item"><label>发布日期</label><input class="input" id="f_date" type="date" value="' + Admin.fmtDate(d.publishDate) + '"></div>' +
        '<div class="form-item"><label>状态</label><select class="select" id="f_status"><option value="1"' + (d.status != 0 ? ' selected' : '') + '>发布</option><option value="0"' + (d.status == 0 ? ' selected' : '') + '>草稿</option></select></div></div>' +
      '<div class="form-item"><label>正文（支持 HTML）</label><textarea class="textarea" id="f_content" style="min-height:180px">' + Admin.esc(d.content || '') + '</textarea></div>';
  }
  function openForm(d) {
    editingId = d ? d.id : null;
    Admin.modal({
      title: editingId ? '编辑新闻' : '新增新闻', width: '720px',
      body: formBody(d),
      onOpen: function (dialog) { Admin.bindUploader(dialog); },
      onConfirm: function (dialog) {
        var title = dialog.querySelector('#f_title').value.trim();
        if (!title) { Admin.toast('请输入标题', 'warning'); return false; }
        var payload = {
          title: title, summary: dialog.querySelector('#f_summary').value.trim(),
          coverImage: dialog.querySelector('#f_cover').value, author: dialog.querySelector('#f_author').value.trim(),
          publishDate: dialog.querySelector('#f_date').value || null,
          content: dialog.querySelector('#f_content').value, status: +dialog.querySelector('#f_status').value
        };
        if (editingId) payload.id = editingId;
        var req = editingId ? Admin.put(API, payload) : Admin.post(API, payload);
        return req.then(function () { Admin.toast('保存成功', 'success'); load(page); return true; })
          .catch(function (e) { Admin.toast(e.message || '保存失败', 'error'); return false; });
      }
    });
  }

  document.getElementById('addBtn').addEventListener('click', function () { openForm(null); });
  document.getElementById('searchBtn').addEventListener('click', function () { kw = document.getElementById('kw').value.trim(); load(1); });
  document.getElementById('kw').addEventListener('keydown', function (e) { if (e.key === 'Enter') { kw = this.value.trim(); load(1); } });
  document.getElementById('tbody').addEventListener('click', function (e) {
    var btn = e.target.closest('[data-act]'); if (!btn) return;
    var id = +btn.getAttribute('data-id'), row = listCache.filter(function (x) { return x.id === id; })[0];
    if (btn.getAttribute('data-act') === 'edit') openForm(row);
    else Admin.confirm('确定删除「' + (row ? row.title : '') + '」吗？').then(function (ok) {
      if (!ok) return;
      Admin.del(API + '/' + id).then(function () { Admin.toast('删除成功', 'success'); load(page); }).catch(function (er) { Admin.toast(er.message, 'error'); });
    });
  });
  load(1);
</script>
</body>
</html>
