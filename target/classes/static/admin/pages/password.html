<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>修改密码</title>
  <link rel="stylesheet" href="/admin/css/admin.css">
</head>
<body>
<div class="card" style="max-width:520px">
  <div class="page-title" style="margin-bottom:22px">修改密码</div>
  <div class="form-item"><label><span class="req">*</span>原密码</label><input class="input" id="oldPwd" type="password" placeholder="请输入原密码"></div>
  <div class="form-item"><label><span class="req">*</span>新密码</label><input class="input" id="newPwd" type="password" placeholder="不少于 5 位"></div>
  <div class="form-item"><label><span class="req">*</span>确认新密码</label><input class="input" id="newPwd2" type="password" placeholder="再次输入新密码"></div>
  <button class="btn btn--primary" id="saveBtn">确认修改</button>
</div>

<script src="/admin/js/admin-common.js"></script>
<script>
  Admin.guard();
  document.getElementById('saveBtn').addEventListener('click', function () {
    var o = document.getElementById('oldPwd').value, n = document.getElementById('newPwd').value, n2 = document.getElementById('newPwd2').value;
    if (!o) { Admin.toast('请输入原密码', 'warning'); return; }
    if (!n || n.length < 5) { Admin.toast('新密码不少于 5 位', 'warning'); return; }
    if (n !== n2) { Admin.toast('两次输入的新密码不一致', 'warning'); return; }
    Admin.put('/api/admin/profile/password', { oldPassword: o, newPassword: n })
      .then(function () {
        Admin.toast('修改成功，请重新登录', 'success');
        setTimeout(function () { Admin.logout(); Admin.gotoLogin(); }, 1200);
      })
      .catch(function (e) { Admin.toast(e.message || '修改失败', 'error'); });
  });
</script>
</body>
</html>
