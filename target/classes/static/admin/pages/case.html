<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>成功案例</title>
  <link rel="stylesheet" href="/admin/css/admin.css">
</head>
<body>
<div class="card">
  <div class="toolbar">
    <div class="left"><span class="page-title">成功案例管理</span></div>
    <div class="right"><button class="btn btn--primary" id="addBtn">+ 新增案例</button></div>
  </div>
  <div class="table-wrap">
    <table class="tb">
      <thead><tr><th width="70">排序</th><th width="120">封面</th><th width="160">标题</th><th>简介</th><th width="120">发布日期</th><th width="90">状态</th><th width="150">操作</th></tr></thead>
      <tbody id="tbody"><tr><td colspan="7" class="empty">加载中…</td></tr></tbody>
    </table>
  </div>
</div>

<script src="/admin/js/admin-common.js"></script>
<script>
  Admin.guard();
  var API = '/api/admin/case', listCache = [], editingId = null;

  function load() {
    Admin.get(API + '/list').then(function (list) { listCache = list; render(); })
      .catch(function (e) { Admin.toast(e.message, 'error'); });
  }
  function render() {
    var tb = document.getElementById('tbody');
    if (!listCache.length) { tb.innerHTML = '<tr><td colspan="7" class="empty">暂无数据</td></tr>'; return; }
    tb.innerHTML = listCache.map(function (c) {
      return '<tr><td>' + (c.sortOrder || 0) + '</td>' +
        '<td>' + (c.imageUrl ? '<img class="thumb" src="' + Admin.esc(c.imageUrl) + '">' : '-') + '</td>' +
        '<td>' + Admin.esc(c.title) + '</td>' +
        '<td style="color:#909399">' + Admin.esc(c.summary || '') + '</td>' +
        '<td style="color:#909399">' + Admin.fmtDate(c.publishDate) + '</td>' +
        '<td>' + (c.status == 0 ? '<span class="tag tag--off">隐藏</span>' : '<span class="tag tag--on">显示</span>') + '</td>' +
        '<td><button class="btn--text primary" data-act="edit" data-id="' + c.id + '">编辑</button>' +
        '<button class="btn--text danger" data-act="del" data-id="' + c.id + '">删除</button></td></tr>';
    }).join('');
  }

  function formBody(d) {
    d = d || {};
    return '' +
      '<div class="form-item"><label><span class="req">*</span>案例标题</label><input class="input" id="f_title" value="' + Admin.esc(d.title || '') + '"></div>' +
      '<div class="form-item"><label>简介</label><textarea class="textarea" id="f_summary">' + Admin.esc(d.summary || '') + '</textarea></div>' +
      '<div class="form-item"><label>封面图</label><div class="uploader">' +
        '<div class="preview"><img ' + (d.imageUrl ? 'src="' + Admin.esc(d.imageUrl) + '"' : 'style="display:none"') + '></div>' +
        '<div><input type="file" accept="image/*" data-upload><div class="tip">选择图片自动上传，建议 400×260</div></div></div>' +
        '<input type="hidden" data-url id="f_image" value="' + Admin.esc(d.imageUrl || '') + '"></div>' +
      '<div class="form-item"><label>详情内容（支持 HTML）</label><textarea class="textarea" id="f_content" style="min-height:120px">' + Admin.esc(d.content || '') + '</textarea></div>' +
      '<div class="form-row"><div class="form-item"><label>发布日期</label><input class="input" id="f_date" type="date" value="' + Admin.fmtDate(d.publishDate) + '"></div>' +
        '<div class="form-item"><label>排序</label><input class="input" id="f_sort" type="number" value="' + (d.sortOrder != null ? d.sortOrder : 0) + '"></div>' +
        '<div class="form-item"><label>状态</label><select class="select" id="f_status"><option value="1"' + (d.status != 0 ? ' selected' : '') + '>显示</option><option value="0"' + (d.status == 0 ? ' selected' : '') + '>隐藏</option></select></div></div>';
  }
  function openForm(d) {
    editingId = d ? d.id : null;
    Admin.modal({
      title: editingId ? '编辑案例' : '新增案例',
      body: formBody(d),
      onOpen: function (dialog) { Admin.bindUploader(dialog); },
      onConfirm: function (dialog) {
        var title = dialog.querySelector('#f_title').value.trim();
        if (!title) { Admin.toast('请输入案例标题', 'warning'); return false; }
        var payload = {
          title: title, summary: dialog.querySelector('#f_summary').value.trim(),
          content: dialog.querySelector('#f_content').value, imageUrl: dialog.querySelector('#f_image').value,
          publishDate: dialog.querySelector('#f_date').value || null,
          sortOrder: +dialog.querySelector('#f_sort').value || 0, status: +dialog.querySelector('#f_status').value
        };
        if (editingId) payload.id = editingId;
        var req = editingId ? Admin.put(API, payload) : Admin.post(API, payload);
        return req.then(function () { Admin.toast('保存成功', 'success'); load(); return true; })
          .catch(function (e) { Admin.toast(e.message || '保存失败', 'error'); return false; });
      }
    });
  }

  document.getElementById('addBtn').addEventListener('click', function () { openForm(null); });
  document.getElementById('tbody').addEventListener('click', function (e) {
    var btn = e.target.closest('[data-act]'); if (!btn) return;
    var id = +btn.getAttribute('data-id'), row = listCache.filter(function (x) { return x.id === id; })[0];
    if (btn.getAttribute('data-act') === 'edit') openForm(row);
    else Admin.confirm('确定删除「' + (row ? row.title : '') + '」吗？').then(function (ok) {
      if (!ok) return;
      Admin.del(API + '/' + id).then(function () { Admin.toast('删除成功', 'success'); load(); }).catch(function (er) { Admin.toast(er.message, 'error'); });
    });
  });
  load();
</script>
</body>
</html>
