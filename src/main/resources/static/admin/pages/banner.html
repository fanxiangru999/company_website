<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>轮播图管理</title>
  <link rel="stylesheet" href="/admin/css/admin.css">
</head>
<body>
<div class="card">
  <div class="toolbar">
    <div class="left"><span class="page-title">轮播图管理</span></div>
    <div class="right"><button class="btn btn--primary" id="addBtn">+ 新增轮播图</button></div>
  </div>
  <div class="table-wrap">
    <table class="tb">
      <thead><tr><th width="70">排序</th><th>主标题</th><th>副标题</th><th width="120">图片</th><th width="90">状态</th><th width="170">创建时间</th><th width="150">操作</th></tr></thead>
      <tbody id="tbody"><tr><td colspan="7" class="empty">加载中…</td></tr></tbody>
    </table>
  </div>
</div>

<script src="/admin/js/admin-common.js"></script>
<script>
  Admin.guard();
  var API = '/api/admin/banner', editingId = null;

  function load() {
    Admin.get(API + '/list').then(function (list) {
      var tb = document.getElementById('tbody');
      if (!list.length) { tb.innerHTML = '<tr><td colspan="7" class="empty">暂无数据</td></tr>'; return; }
      tb.innerHTML = list.map(function (b) {
        return '<tr><td>' + (b.sortOrder || 0) + '</td>' +
          '<td>' + Admin.esc(b.title) + '</td>' +
          '<td style="color:#909399">' + Admin.esc(b.subtitle || '') + '</td>' +
          '<td>' + (b.imageUrl ? '<img class="thumb" src="' + Admin.esc(b.imageUrl) + '">' : '-') + '</td>' +
          '<td>' + (b.status == 0 ? '<span class="tag tag--off">隐藏</span>' : '<span class="tag tag--on">显示</span>') + '</td>' +
          '<td style="color:#909399">' + Admin.fmtDate(b.createTime) + '</td>' +
          '<td><button class="btn--text primary" data-edit=\'' + JSON.stringify(b).replace(/'/g, "&#39;") + '\'>编辑</button>' +
          '<button class="btn--text danger" data-del="' + b.id + '">删除</button></td></tr>';
      }).join('');
    }).catch(function (e) { Admin.toast(e.message, 'error'); });
  }

  function formBody(d) {
    d = d || {};
    return '' +
      '<div class="form-item"><label><span class="req">*</span>主标题</label><input class="input" id="f_title" value="' + Admin.esc(d.title || '') + '"></div>' +
      '<div class="form-item"><label>副标题</label><input class="input" id="f_subtitle" value="' + Admin.esc(d.subtitle || '') + '"></div>' +
      '<div class="form-item"><label>背景图</label><div class="uploader">' +
        '<div class="preview"><img ' + (d.imageUrl ? 'src="' + Admin.esc(d.imageUrl) + '"' : 'style="display:none"') + '></div>' +
        '<div><input type="file" accept="image/*" data-upload><div class="tip">选择图片自动上传，建议 1920×760</div></div></div>' +
        '<input type="hidden" data-url id="f_image" value="' + Admin.esc(d.imageUrl || '') + '"></div>' +
      '<div class="form-row"><div class="form-item"><label>排序</label><input class="input" id="f_sort" type="number" value="' + (d.sortOrder != null ? d.sortOrder : 0) + '"></div>' +
        '<div class="form-item"><label>状态</label><select class="select" id="f_status"><option value="1"' + (d.status != 0 ? ' selected' : '') + '>显示</option><option value="0"' + (d.status == 0 ? ' selected' : '') + '>隐藏</option></select></div></div>';
  }

  function openForm(d) {
    editingId = d ? d.id : null;
    Admin.modal({
      title: editingId ? '编辑轮播图' : '新增轮播图',
      body: formBody(d),
      onOpen: function (dialog) { Admin.bindUploader(dialog); },
      onConfirm: function (dialog) {
        var title = dialog.querySelector('#f_title').value.trim();
        if (!title) { Admin.toast('请输入主标题', 'warning'); return false; }
        var payload = {
          title: title,
          subtitle: dialog.querySelector('#f_subtitle').value.trim(),
          imageUrl: dialog.querySelector('#f_image').value,
          sortOrder: +dialog.querySelector('#f_sort').value || 0,
          status: +dialog.querySelector('#f_status').value
        };
        if (editingId) payload.id = editingId;
        var req = editingId ? Admin.put(API, payload) : Admin.post(API, payload);
        return req.then(function () { Admin.toast('保存成功', 'success'); load(); return true; })
          .catch(function (e) { Admin.toast(e.message || '保存失败', 'error'); return false; });
      }
    });
  }

  document.getElementById('addBtn').addEventListener('click', function () { openForm(null); });
  document.getElementById('tbody').addEventListener('click', function (e) {
    var ed = e.target.closest('[data-edit]'), dl = e.target.closest('[data-del]');
    if (ed) { openForm(JSON.parse(ed.getAttribute('data-edit').replace(/&#39;/g, "'"))); }
    if (dl) {
      Admin.confirm('确定删除该轮播图吗？').then(function (ok) {
        if (!ok) return;
        Admin.del(API + '/' + dl.getAttribute('data-del')).then(function () { Admin.toast('删除成功', 'success'); load(); })
          .catch(function (er) { Admin.toast(er.message, 'error'); });
      });
    }
  });

  load();
</script>
</body>
</html>
